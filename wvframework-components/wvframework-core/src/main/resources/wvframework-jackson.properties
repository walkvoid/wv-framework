# Default Jackson settings aligned with JsonUtils static ObjectMapper.
# Loaded with lowest precedence; application.properties can override any key.
spring.jackson.default-property-inclusion=always
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.serialization.write-date-keys-as-timestamps=false
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.deserialization.fail-on-unknown-properties=false
# java.time.LocalDate / LocalDateTime (spring.jackson.date-format only applies to java.util.Date)
wv.jackson.local-date-format=yyyy-MM-dd
wv.jackson.local-date-time-format=yyyy-MM-dd HH:mm:ss
